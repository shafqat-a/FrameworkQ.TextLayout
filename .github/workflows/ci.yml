name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test -c Release
      - run: dotnet pack src/TextMagic -c Release -o artifacts
      - name: Zip the compiled assemblies
        run: |
          cd src/TextMagic/bin/Release
          for tfm in net8.0 net10.0; do zip -j "$GITHUB_WORKSPACE/artifacts/TextMagic-${GITHUB_REF_NAME//\//-}-$tfm.zip" $tfm/TextMagic.dll $tfm/TextMagic.xml $tfm/TextMagic.pdb; done
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber || gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
